<mat-card class="auth-card">
  <mat-card-content>
    <div class="auth-header">
      <h1>Reset password</h1>
      <p>Enter your email and we’ll send a reset link</p>
    </div>

    <form class="auth-form" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" placeholder="you@example.com" required />
      </mat-form-field>

      <button mat-flat-button color="primary" class="auth-submit" type="submit">Send reset link</button>

      <div class="auth-links">
        <a class="auth-link" routerLink="/login">Back to login</a>
        <a class="auth-link" routerLink="/register">Create account</a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
