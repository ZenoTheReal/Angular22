<mat-card class="dashboard-card">
    <mat-card-header>
        <mat-card-title>Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort  class="dashboard-table">
            <ng-container matColumnDef="eid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.eid}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header > Name </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>
            
            <ng-container matColumnDef="temperature">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Temperature </th>
                <td mat-cell *matCellDef="let element"> {{element.temperature | formatter}} </td>
            </ng-container>

            <ng-container matColumnDef="humidity">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Humidity </th>
                <td mat-cell *matCellDef="let element"> {{element.humidity}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row appHighlighter [humidity]="row.humidity" *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

          <mat-paginator [pageSize]="10"[pageSizeOptions]="[3, 10, 25, 100]" aria-label="Select page"></mat-paginator>
    </mat-card-content>
</mat-card>
